name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the bundled wallet document against its reviewed pin
        run: npm run verify:embedded-web

      - name: Run lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Native bridge and storage regressions
        run: npm run test:ci

      - name: Export iOS, Android, and web bundles
        run: npm run build

      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true

  reproduce-embedded-wallet:
    # Proves the pinned digest corresponds to public frontend source, not just
    # that the committed blob is unchanged. Slow, so it runs on its own.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Rebuild the pinned wallet document and compare digests
        # ALLOW_UNREACHABLE_PIN is temporary: the pin points at a pull-request
        # branch whose commit a squash merge will make unreachable. Drop it
        # once the pin moves to a tag on the frontend default branch.
        env:
          ALLOW_UNREACHABLE_PIN: '1'
        run: bash scripts/reproduce-embedded-web.sh
