name: CI

# Each change is tested once, on its pull request. The weekly run surfaces drift
# in the registry and the external pins.
on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      allow_unreachable_pin:
        description: >-
          Let the reproduce job pass when the pinned frontend commit cannot be
          fetched. Only for the window where the pin names a pull-request
          branch whose commit a squash merge has orphaned.
        type: boolean
        default: false

# The reproduce job runs another repository's build, so it runs third-party
# lifecycle scripts. Give the token nothing to do.
permissions:
  contents: read

# The weekly run tests dev, where changes land first. Scheduled runs read this
# file from main.
env:
  TEST_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the bundled wallet document against its reviewed pin
        run: npm run verify:embedded-web

      # lint:ratchet starts with the same ESLint command as npm run lint.
      - name: Lint and check the lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LINT_RATCHET_BASE" ]; then
            git fetch --no-tags origin "$LINT_RATCHET_BASE"
          else
            git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
            LINT_RATCHET_BASE="$(git merge-base HEAD origin/dev)"
            if [ "$LINT_RATCHET_BASE" = "$(git rev-parse HEAD)" ]; then
              LINT_RATCHET_BASE="$(git rev-parse HEAD^1)"
            fi
          fi
          npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: TypeScript type check
        run: npm run typecheck

      - name: Native bridge and storage regressions
        run: env -u DISPLAY -u WAYLAND_DISPLAY npm run test:ci

      - name: Export iOS, Android, and web bundles
        run: npm run build

      # Blocking when a pull request changes the dependencies or the Expo config,
      # and on the weekly run. Otherwise a new Expo patch release would fail
      # pull requests that changed neither, so it only warns.
      - name: Expo doctor
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ] && git diff --quiet "$PR_BASE" HEAD -- package.json package-lock.json app.json; then
            npx expo-doctor || echo "::warning::Expo doctor found drift this pull request did not cause."
          else
            npx expo-doctor
          fi

      # Last, so a failing audit can never skip the checks above.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

  reproduce-embedded-wallet:
    # Proves the pinned digest corresponds to public frontend source, not just
    # that the committed blob is unchanged. It runs on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Rebuild the pinned wallet document and compare digests
        # Fails closed. The pinned frontend commit is public, so it is
        # fetchable by SHA and an unfetchable pin is a finding rather than a
        # skip. The escape hatch exists only as an explicit manual input, for
        # the window where the pin names a pull-request branch whose commit a
        # squash merge has orphaned. It is never set on a push or a PR.
        env:
          ALLOW_UNREACHABLE_PIN: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unreachable_pin && '1' || '0' }}
        run: bash scripts/reproduce-embedded-web.sh
